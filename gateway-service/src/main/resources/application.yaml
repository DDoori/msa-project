server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/users/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/products/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/orders/**

            - id: notification-service
              uri: http://localhost:8084
              predicates:
                - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
